<h2>Вход</h2>

<!-- [formGroup] связывает <form> с объектом формы в классе,
     (ngSubmit) — обработчик отправки -->
<form class="login" [formGroup]="form" (ngSubmit)="submit()">
  <label>
    Email
    <input type="email" formControlName="email" autocomplete="email" />
  </label>
  @if (form.controls.email.touched && form.controls.email.invalid) {
    <p class="field-error">Введите корректный email</p>
  }

  <label>
    Пароль
    <input type="password" formControlName="password" autocomplete="current-password" />
  </label>
  @if (form.controls.password.touched && form.controls.password.invalid) {
    <p class="field-error">Введите пароль</p>
  }

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Входим...' : 'Войти' }}
  </button>
</form>
