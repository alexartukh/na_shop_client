<header class="header">
  <!-- routerLink — переход между страницами без перезагрузки -->
  <h1><a routerLink="/">{{ title() }}</a></h1>
  <nav>
    <a routerLink="/category/main">Каталог</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/my-account">Мой аккаунт</a>
    } @else {
      <a routerLink="/login">Войти</a>
    }
  </nav>
</header>

<main class="main">
  <!-- Сюда роутер подставляет компонент текущей страницы -->
  <router-outlet />
</main>
