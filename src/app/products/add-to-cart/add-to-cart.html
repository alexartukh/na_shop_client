<div class="add-to-cart">
  <!-- (input) срабатывает при каждом изменении поля; $any(...) — чтобы достать value -->
  <input
    type="number"
    min="1"
    step="1"
    [value]="quantity()"
    (input)="onInput($any($event.target).value)"
  />
  <button type="button" class="green" [disabled]="!valid()" (click)="add()">Добавить</button>
</div>

@if (!valid()) {
  <p class="error">Введите целое число больше нуля</p>
}
@if (added()) {
  <p class="ok">Добавлено в корзину</p>
}
