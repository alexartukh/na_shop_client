<a routerLink="/category/main">← Назад в каталог</a>

@if (loading()) {
  <p>Загрузка...</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else if (product(); as product) {
  <div class="details">
    <!-- Левая часть: картинка-заглушка -->
    <div class="image">Нет изображения</div>

    <!-- Правая часть: информация о товаре и добавление в корзину -->
    <div>
      <div class="info">
        <h2>{{ product.name }}</h2>
        @if (product.description) {
          <p class="description">{{ product.description }}</p>
        }
        <p class="price">{{ product.price }} €</p>
      </div>
      <div>
        <app-add-to-cart [product]="product" />
      </div>
    </div>
  </div>
}
