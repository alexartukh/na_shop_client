<main class="wrapper">
  <h1>{{ title }}</h1>
  <p>Простое тестовое Angular-приложение.</p>

  <app-greeting name="Alex"></app-greeting>
  <app-greeting name="Denis"></app-greeting>

  <app-greeting2 name="Alex"></app-greeting2>
  <app-greeting2 name="Denis"></app-greeting2>

  <div class="counter">
    <button type="button" (click)="increment()">+1</button>
    <span class="count">{{ count }}</span>
    <button type="button" (click)="reset()">Сброс</button>
  </div>
</main>
